name: Lean build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Axiom audit
        run: |
          lake env lean AxiomAudit.lean | tee axioms.txt
          if grep -E "sorryAx|ofReduceBool|Lean\.trustCompiler" axioms.txt; then
            echo "Non-standard axiom found"; exit 1
          fi
